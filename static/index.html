<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>局域网聊天室</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1ea;
      --panel: rgba(255, 255, 255, 0.9);
      --ink: #1d2733;
      --muted: #6d7783;
      --line: #e4e0d8;
      --accent: #176b5b;
      --accent-dark: #0e5548;
      --accent-soft: #e3f1ed;
      --self: #176b5b;
      --other: #ffffff;
      --danger: #b3483e;
      --shadow: 0 24px 70px rgba(43, 52, 58, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      max-width: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(23, 107, 91, 0.13), transparent 34%),
        radial-gradient(circle at 92% 90%, rgba(199, 137, 77, 0.12), transparent 30%),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      width: min(920px, 100%);
      min-width: 0;
      height: 100dvh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 14px
        max(14px, env(safe-area-inset-bottom));
    }

    .chat-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      height: 100%;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      place-items: center;
      color: white;
      background: var(--accent);
      border-radius: 13px 13px 13px 4px;
      box-shadow: 0 7px 18px rgba(23, 107, 91, 0.23);
    }

    .brand-mark svg {
      width: 23px;
      height: 23px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      overflow: hidden;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand p {
      margin: 3px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      flex: 0 1 auto;
      min-width: 0;
      align-items: center;
      gap: 12px;
    }

    .nickname-field {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .nickname-field input {
      width: 116px;
      min-width: 0;
      padding: 8px 10px;
      color: var(--ink);
      background: #f7f5f0;
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .nickname-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 91, 0.11);
    }

    .connection {
      display: flex;
      flex: 0 0 auto;
      min-width: 84px;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #b6aea1;
      border-radius: 50%;
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    .connection.is-online .status-dot {
      background: #2ca66f;
      box-shadow: 0 0 0 3px rgba(44, 166, 111, 0.13);
    }

    .connection.is-connecting .status-dot {
      background: #d49a3a;
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }

    .messages {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 24px;
      scrollbar-color: #cec8bc transparent;
      scrollbar-width: thin;
    }

    .empty-state {
      display: grid;
      min-height: 100%;
      place-content: center;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      place-items: center;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 18px 18px 18px 6px;
    }

    .empty-icon svg {
      width: 28px;
      height: 28px;
    }

    .empty-state strong {
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 17px;
    }

    .empty-state span {
      max-width: 360px;
      font-size: 13px;
      line-height: 1.7;
    }

    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 17px;
      animation: arrive 180ms ease-out both;
    }

    .message.is-self {
      align-items: flex-end;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 5px 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .message.is-self .message-meta {
      flex-direction: row-reverse;
    }

    .sender {
      color: #44505d;
      font-weight: 600;
    }

    .message-body {
      display: flex;
      max-width: min(78%, 650px);
      align-items: flex-end;
      gap: 7px;
    }

    .message.is-self .message-body {
      flex-direction: row-reverse;
    }

    .message-text {
      min-width: 0;
      margin: 0;
      padding: 11px 14px;
      color: var(--ink);
      background: var(--other);
      border: 1px solid var(--line);
      border-radius: 6px 16px 16px 16px;
      box-shadow: 0 4px 16px rgba(36, 48, 55, 0.05);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.58;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.is-self .message-text {
      color: #fff;
      background: var(--self);
      border-color: var(--self);
      border-radius: 16px 6px 16px 16px;
    }

    .copy-button {
      flex: 0 0 auto;
      padding: 4px 7px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      opacity: 0.6;
      transition: color 150ms ease, background 150ms ease, opacity 150ms ease;
    }

    .copy-button:hover,
    .copy-button:focus-visible {
      color: var(--accent);
      background: var(--accent-soft);
      opacity: 1;
      outline: none;
    }

    .message.is-self .copy-button:hover,
    .message.is-self .copy-button:focus-visible {
      color: var(--accent-dark);
    }

    .composer-wrap {
      padding: 14px 18px 17px;
      background: rgba(250, 249, 246, 0.82);
      border-top: 1px solid var(--line);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px 8px 8px 15px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 7px 24px rgba(37, 45, 51, 0.06);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .composer:focus-within {
      border-color: rgba(23, 107, 91, 0.55);
      box-shadow: 0 0 0 3px rgba(23, 107, 91, 0.08);
    }

    .composer textarea {
      width: 100%;
      max-height: 128px;
      min-height: 31px;
      padding: 5px 0;
      overflow-y: auto;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      resize: none;
      font-size: 15px;
      line-height: 1.45;
    }

    .composer textarea::placeholder {
      color: #a19c93;
    }

    .send-button {
      display: grid;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      place-items: center;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease, opacity 150ms ease;
    }

    .send-button:hover:not(:disabled) {
      background: var(--accent-dark);
    }

    .send-button:active:not(:disabled) {
      transform: scale(0.95);
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .send-button svg {
      width: 20px;
      height: 20px;
    }

    .composer-hint {
      margin: 8px 4px 0;
      color: #918b82;
      font-size: 11px;
      text-align: right;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      z-index: 10;
      max-width: calc(100vw - 32px);
      padding: 10px 15px;
      color: white;
      background: #26323c;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(20, 27, 32, 0.2);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 640px) {
      .app-shell {
        padding: 0;
      }

      .chat-panel {
        border: 0;
        border-radius: 0;
      }

      .chat-header {
        gap: 10px;
        padding: max(13px, env(safe-area-inset-top)) 14px 13px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 12px 12px 12px 4px;
      }

      .brand p {
        display: none;
      }

      .header-actions {
        gap: 8px;
      }

      .nickname-field span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }

      .nickname-field input {
        width: 92px;
        padding: 7px 8px;
      }

      .connection {
        min-width: 0;
      }

      .messages {
        padding: 18px 14px;
      }

      .message-body {
        max-width: 88%;
      }

      .composer-wrap {
        padding: 10px 12px max(11px, env(safe-area-inset-bottom));
      }

      .composer-hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Prevent iOS Safari from zooming the page when a form control is focused. */
    @supports (-webkit-touch-callout: none) {
      .nickname-field input,
      .composer textarea {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="chat-panel" aria-label="局域网聊天室">
      <header class="chat-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
              <path d="M8 9h8M8 13h5"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1>局域网聊天室</h1>
            <p>同一 Wi-Fi 下，打开网页即可聊天</p>
          </div>
        </div>

        <div class="header-actions">
          <label class="nickname-field">
            <span>昵称</span>
            <input id="nickname" maxlength="30" autocomplete="nickname"
              aria-label="我的昵称">
          </label>
          <div id="connection" class="connection is-connecting"
            role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="connection-text">连接中</span>
          </div>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite"
        aria-label="聊天消息">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
              <path d="M8 10h.01M12 10h.01M16 10h.01"/>
            </svg>
          </div>
          <strong>还没有消息</strong>
          <span>在电脑和手机上同时打开此页面，发送第一条消息试试。刷新后仍会保留最近 100 条，服务重启后清空。</span>
        </div>
      </div>

      <footer class="composer-wrap">
        <form id="composer" class="composer">
          <textarea id="message-input" rows="1" maxlength="4000"
            placeholder="输入消息，Enter 发送，Shift + Enter 换行"
            aria-label="消息内容"></textarea>
          <button id="send-button" class="send-button" type="submit"
            aria-label="发送消息" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4Z"/>
              <path d="M22 2 11 13"/>
            </svg>
          </button>
        </form>
        <div class="composer-hint">消息仅在当前局域网内传输，请勿发送敏感信息</div>
      </footer>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const MAX_MESSAGE_LENGTH = 4000;
      const messagesEl = document.getElementById("messages");
      const emptyStateEl = document.getElementById("empty-state");
      const connectionEl = document.getElementById("connection");
      const connectionTextEl = document.getElementById("connection-text");
      const nicknameEl = document.getElementById("nickname");
      const composerEl = document.getElementById("composer");
      const inputEl = document.getElementById("message-input");
      const sendButtonEl = document.getElementById("send-button");
      const toastEl = document.getElementById("toast");

      let socket = null;
      let connectionId = null;
      let reconnectTimer = null;
      let reconnectAttempt = 0;
      let toastTimer = null;
      let onlineCount = 0;

      function readStorage(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // The chat still works when storage is unavailable.
        }
      }

      const isLikelyPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(
        navigator.userAgent
      );
      nicknameEl.value =
        readStorage("lan-chat-nickname") || (isLikelyPhone ? "手机" : "电脑");

      nicknameEl.addEventListener("input", () => {
        writeStorage("lan-chat-nickname", nicknameEl.value);
      });

      window.addEventListener("storage", (event) => {
        if (event.key === "lan-chat-nickname" && event.newValue) {
          nicknameEl.value = event.newValue;
        }
      });

      function setConnection(state, label) {
        connectionEl.classList.remove(
          "is-online",
          "is-connecting",
          "is-offline"
        );
        connectionEl.classList.add(`is-${state}`);
        connectionTextEl.textContent = label;
        const connected = state === "online";
        sendButtonEl.disabled = !connected;
        inputEl.disabled = false;
      }

      function showToast(text) {
        clearTimeout(toastTimer);
        toastEl.textContent = text;
        toastEl.classList.add("is-visible");
        toastTimer = setTimeout(() => {
          toastEl.classList.remove("is-visible");
        }, 2200);
      }

      function formatTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        const now = new Date();
        const sameDay =
          date.getFullYear() === now.getFullYear() &&
          date.getMonth() === now.getMonth() &&
          date.getDate() === now.getDate();
        return new Intl.DateTimeFormat("zh-CN", {
          ...(sameDay
            ? {}
            : { month: "2-digit", day: "2-digit" }),
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(date);
      }

      function fullTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).format(date);
      }

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return;
          } catch {
            // Fall through to the legacy path for browsers that deny access.
          }
        }

        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.top = "0";
        area.style.left = "-9999px";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.focus();
        area.select();
        area.setSelectionRange(0, area.value.length);
        const copied = document.execCommand("copy");
        area.remove();
        inputEl.focus({ preventScroll: true });
        if (!copied) {
          throw new Error("copy failed");
        }
      }

      function updateEmptyState() {
        const hasMessages = messagesEl.querySelector(".message") !== null;
        emptyStateEl.hidden = hasMessages;
      }

      function isNearBottom() {
        return (
          messagesEl.scrollHeight -
            messagesEl.scrollTop -
            messagesEl.clientHeight <
          120
        );
      }

      function scrollToBottom(force = false) {
        if (force || isNearBottom()) {
          requestAnimationFrame(() => {
            messagesEl.scrollTop = messagesEl.scrollHeight;
          });
        }
      }

      function createMessageElement(message, animate) {
        const article = document.createElement("article");
        article.className = "message";
        if (message.senderId === connectionId) {
          article.classList.add("is-self");
        }
        if (!animate) {
          article.style.animation = "none";
        }

        const meta = document.createElement("div");
        meta.className = "message-meta";

        const sender = document.createElement("span");
        sender.className = "sender";
        sender.textContent =
          message.senderId === connectionId ? "我" : message.sender;

        const time = document.createElement("time");
        time.dateTime = message.sentAt;
        time.textContent = formatTime(message.sentAt);
        time.title = fullTime(message.sentAt);

        meta.append(sender, time);

        const body = document.createElement("div");
        body.className = "message-body";

        const text = document.createElement("pre");
        text.className = "message-text";
        text.textContent = message.text;

        const copyButton = document.createElement("button");
        copyButton.type = "button";
        copyButton.className = "copy-button";
        copyButton.textContent = "复制";
        copyButton.setAttribute("aria-label", "复制这条消息");
        copyButton.addEventListener("click", async () => {
          try {
            await copyText(message.text);
            copyButton.textContent = "已复制";
            setTimeout(() => {
              copyButton.textContent = "复制";
            }, 1500);
          } catch {
            showToast("复制失败，请手动选择文字");
          }
        });

        body.append(text, copyButton);
        article.append(meta, body);
        return article;
      }

      function renderHistory(history) {
        messagesEl.querySelectorAll(".message").forEach((el) => el.remove());
        for (const message of history) {
          messagesEl.appendChild(createMessageElement(message, false));
        }
        updateEmptyState();
        scrollToBottom(true);
      }

      function appendMessage(message, animate = true) {
        const shouldScroll = isNearBottom() || message.senderId === connectionId;
        messagesEl.appendChild(createMessageElement(message, animate));
        updateEmptyState();
        if (shouldScroll) {
          scrollToBottom(true);
        }
      }

      function handleEvent(event) {
        if (event.type === "ready") {
          connectionId = event.connectionId;
          onlineCount = event.online;
          setConnection("online", `在线 ${onlineCount}`);
          renderHistory(Array.isArray(event.history) ? event.history : []);
          return;
        }

        if (event.type === "message" && event.message) {
          appendMessage(event.message);
          return;
        }

        if (event.type === "presence") {
          onlineCount = event.online;
          setConnection("online", `在线 ${onlineCount}`);
          return;
        }

        if (event.type === "error") {
          showToast(event.detail || "发送失败");
        }
      }

      function scheduleReconnect() {
        clearTimeout(reconnectTimer);
        const delay = Math.min(1000 * 2 ** reconnectAttempt, 10000);
        reconnectAttempt += 1;
        reconnectTimer = setTimeout(connect, delay);
      }

      function connect() {
        if (
          socket &&
          (socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING)
        ) {
          return;
        }

        clearTimeout(reconnectTimer);
        setConnection("connecting", "连接中");

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(
          `${protocol}//${window.location.host}/ws`
        );

        socket.addEventListener("open", () => {
          reconnectAttempt = 0;
        });

        socket.addEventListener("message", (messageEvent) => {
          try {
            handleEvent(JSON.parse(messageEvent.data));
          } catch {
            showToast("收到一条无法识别的消息");
          }
        });

        socket.addEventListener("close", () => {
          connectionId = null;
          socket = null;
          setConnection("offline", "已断开");
          scheduleReconnect();
        });

        socket.addEventListener("error", () => {
          setConnection("offline", "已断开");
        });
      }

      function resizeInput() {
        inputEl.style.height = "auto";
        inputEl.style.height = `${Math.min(inputEl.scrollHeight, 128)}px`;
      }

      function sendMessage() {
        const text = inputEl.value;
        if (!text.trim()) {
          return;
        }
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          showToast("连接已断开，正在重试");
          return;
        }
        if (text.length > MAX_MESSAGE_LENGTH) {
          showToast(`消息不能超过 ${MAX_MESSAGE_LENGTH} 个字符`);
          return;
        }

        socket.send(
          JSON.stringify({
            type: "message",
            sender: nicknameEl.value,
            text
          })
        );
        inputEl.value = "";
        resizeInput();
        inputEl.focus({ preventScroll: true });
      }

      composerEl.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage();
      });

      inputEl.addEventListener("input", resizeInput);
      inputEl.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing
        ) {
          event.preventDefault();
          sendMessage();
        }
      });

      window.addEventListener("online", connect);
      connect();
      resizeInput();
    })();
  </script>
</body>
</html>
