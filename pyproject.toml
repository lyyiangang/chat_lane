[project]
name = "chat-lane"
version = "0.1.0"
description = "局域网聊天室：同一局域网内通过浏览器实时聊天"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "websockets>=10.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
